services:
  # ---------------- App principal (puerto 8501) ----------------
  backend:
    build: ./backend
    container_name: prestanza-backend
    expose:
      - "8000"
    volumes:
      - ./backend/datos_actuales:/app/datos_actuales
      - ./backend/modelos_versionados:/app/modelos_versionados
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: prestanza-frontend
    ports:
      - "8501:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ---------------- Modelos por índices (puerto 8502) ----------------
  # Misma imagen del backend con otra API; comparte datos_actuales con la app principal.
  backend-indices:
    build: ./backend
    container_name: prestanza-backend-indices
    command: ["uvicorn", "main_indices:app", "--host", "0.0.0.0", "--port", "8000"]
    expose:
      - "8000"
    volumes:
      - ./backend/datos_actuales:/app/datos_actuales
      - ./backend/modelos_indices:/app/modelos_indices
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend-indices:
    build:
      context: ./frontend
      args:
        MODO: indices
    container_name: prestanza-frontend-indices
    ports:
      - "8502:80"
    depends_on:
      backend-indices:
        condition: service_healthy
    restart: unless-stopped
